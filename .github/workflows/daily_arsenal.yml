name: Daily Arsenal news

on:
  schedule:
    # 22:17 UTC = 07:17 KST. Off the hour because GitHub delays top-of-hour cron jobs.
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-arsenal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Arsenal news
        run: python scripts/fetch_arsenal.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arsenal.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update Arsenal news ($(date -u +%Y-%m-%d))"
          git push
